services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hirenexus-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev_Only!ChangeThis123"
    ports:
      - "1433:1433"
    volumes:
      - hirenexus_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalDev_Only!ChangeThis123' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  hirenexus_sql_data:
