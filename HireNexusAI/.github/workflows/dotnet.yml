name: .NET Build
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore backend/HireNexusAI.Api/HireNexusAI.Api.csproj
      - name: Build
        run: dotnet build backend/HireNexusAI.Api/HireNexusAI.Api.csproj --configuration Release --no-restore
